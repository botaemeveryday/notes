baseURL = "https://botaemeveryday.github.io/notes/"
title = "botaemeveryday"

defaultContentLanguage = "ru"
hasCJKLanguage = false

[module]
  [module.hugoVersion]
  min = "0.97.0"
  extended = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = true
      [markup.goldmark.parser.attribute]
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false

[taxonomies]
  tag = "tags"

[params]
  author = "notakeith & salt-caramel"
  description = "Конспекты лекций ИТМО: операционные системы, математическая статистика, базы данных, C++ и Java. Открытые материалы для студентов направления ИС."
  avatar = "images/avatar.webp"
  headerTitle = "botaemeveryday"
  motto = "notes"
  favicon = "images/avatar.webp"
  stickyNav = false
  showTableOfContents = true
  showSummaryCoverInPost = true
  imageZoomableInPost = true
  showPrevNextPost = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[[cascade]]
  [cascade.build]
    list = "never"
  [cascade.target]
    path = "/posts/public/pins/**"