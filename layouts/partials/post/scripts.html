{{ $post := resources.Get "js/post.js" }}
{{ if hugo.IsProduction }}{{ $post = $post | minify | fingerprint }}{{ end }}
<script defer src="{{ $post.RelPermalink }}"></script>

{{ if site.Params.imageZoomableInPost }}
  <script type="module">
    import mediumZoom from 'https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/+esm';
    mediumZoom('#post-content img', {
      background: getComputedStyle(document.documentElement).getPropertyValue('--color-base-100').trim() || '#fff',
      margin: 24,
    });
  </script>
{{ end }}
