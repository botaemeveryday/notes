{{ if site.Params.showTableOfContents }}
{{- /* Разметка намеренно совпадает с sidebar-left.html. Список внутри
       рисует Hugo (.TableOfContents), поэтому его пункты подгоняются под
       .cn-side__link селекторами в input.css. */ -}}
<nav class="cn-side" aria-label="Содержание лекции"
     data-toc
     data-active-class="cn-side__link--active">
  <div class="cn-side__head">
    <span class="cn-side__bar"></span>
    <span class="cn-side__title">Содержание</span>
  </div>

  {{ .TableOfContents }}
</nav>
{{ end }}
