{{ $pages := partialCached "utils/section-pages.html" . .CurrentSection.RelPermalink }}
{{ $current := .RelPermalink }}

<nav class="cn-side" aria-label="Лекции курса">
  <div class="cn-side__head">
    <!-- <span class="cn-side__bar"></span> -->
    <a class="cn-side__title" href="{{ .CurrentSection.RelPermalink }}">
      ← {{ .CurrentSection.Title | default "Вернуться к курсу" }}
    </a>
  </div>

  <ul class="cn-side__list">
    {{ range $pages }}
      {{ $active := eq .RelPermalink $current }}
      <li>
        <a href="{{ .RelPermalink }}"
           {{ if $active }}aria-current="page"{{ end }}
           class="cn-side__link{{ if $active }} cn-side__link--active{{ end }}">
          <span class="truncate">{{ .LinkTitle | default .Title }}</span>
          <span class="cn-side__dot"></span>
        </a>
      </li>
    {{ end }}
  </ul>
</nav>
